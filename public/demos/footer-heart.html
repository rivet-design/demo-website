<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivet footer — spinning mark</title>
<style>
  :root { --cream: #E4E3DB; --ink: #2A1C17; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  [hidden] { display: none !important; }
  body {
    background: transparent;
    color: var(--ink);
    font: 400 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100%;
  }

  .hint { display: none;
    position: fixed;
    top: 24px; left: 24px;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    opacity: 0.4;
  }

  .footer {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0 auto;
    aspect-ratio: 1585 / 757;
    --px: 0.757;                     /* px per viewBox unit, resynced by JS */
    perspective: calc(var(--px) * 2200px);
    perspective-origin: 28.416% 32.489%;
  }

  .wordmark {
    position: absolute;
    left: 0;
    top: 38.329%;
    width: 100%;
    height: 61.671%;
    display: block;
  }

  .mark {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
    transform-origin: 28.416% 32.489%;
    will-change: transform;
  }

  .stack {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* every slice is sized to the mark's bounding box, not the whole footer */
  .slice {
    position: absolute;
    left: 16.327%;
    top: 13.652%;
    width: 24.178%;
    height: 37.673%;
    overflow: visible;
    transform: translateZ(calc(var(--z) * var(--px) * 1px));
  }

  .hit {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    outline: none;
  }
  .hit path {
    fill: transparent;
    pointer-events: fill;
    cursor: grab;
    touch-action: none;              /* a drag on the mark is never a page scroll */
  }
  body.dragging, body.dragging .hit path { cursor: grabbing; }
  .hit:focus-visible path {
    stroke: rgba(220, 70, 51, 0.9);
    stroke-width: 5;
  }
</style>
</head>

         aria-label="Spin the Rivet mark">
      <g class="hit-shape"><path d="M459.421 384.798C454.44 389.778 446.362 389.778 441.382 384.798L439.256 382.671C439.216 382.633 439.176 382.595 439.137 382.556L264.751 208.169C264.712 208.131 264.674 208.091 264.636 208.052L262.514 205.93C257.533 200.949 257.533 192.871 262.514 187.89L264.578 185.826C264.635 185.767 264.692 185.708 264.751 185.65L340.684 109.716C340.742 109.658 340.802 109.601 340.861 109.544L342.932 107.473C347.912 102.493 355.987 102.496 360.968 107.476L438.749 185.258C444.93 191.438 454.925 191.476 461.153 185.373L537.202 109.324C537.234 109.292 537.267 109.261 537.3 109.229L539.444 107.085C544.424 102.104 552.499 102.102 557.48 107.081L638.27 187.872C643.251 192.852 643.251 200.931 638.27 205.911L540.19 303.991C540.072 304.119 539.963 304.256 539.839 304.38L459.421 384.798Z"/></g>

<script>
(() => {
  const footer  = document.getElementById('footer');
  const mark    = document.getElementById('mark');
  const hit     = document.getElementById('hit');
  const stacks  = [...mark.querySelectorAll('.stack')];
  const hitAreas = [...hit.querySelectorAll('.hit-shape')];
  const reduce  = matchMedia('(prefers-reduced-motion: reduce)');

  // keep the extrusion depth proportional to the rendered size
  const sync = () => footer.style.setProperty('--px', (footer.clientWidth / 1585).toFixed(4));
  sync();
  addEventListener('resize', sync);
  if (window.ResizeObserver) new ResizeObserver(sync).observe(footer);

  const spring = (value) => ({ value, target: value, vel: 0 });
  const yaw   = spring(0);   // full turns, driven by clicks
  const tiltX = spring(0);   // pointer tilt
  const tiltY = spring(0);
  const lift  = spring(0);   // hover pop, 0..1

  const step = (s, k, d, dt) => {
    s.vel += (k * (s.target - s.value) - d * s.vel) * dt;
    s.value += s.vel * dt;
  };

  // Each click adds a turn and lands on the other shape. The swap happens a
  // quarter turn in, where the mark is edge-on and the silhouette is hidden.
  const shapeAt = (y) => {
    const i = Math.floor((y - 90) / 360) + 1;      // negative when dragged backwards
    return ((i % 2) + 2) % 2;
  };
  let shown = 0;
  const showShape = (i) => {
    if (i === shown) return;
    shown = i;
    stacks.forEach((s, k) => s.hidden = k !== i);
    hitAreas.forEach((s, k) => s.hidden = k !== i);
  };

  let hovering = false, dragging = false, t0 = performance.now(), idle = 0;

  const frame = (now) => {
    const dt = Math.min((now - t0) / 1000, 1 / 30);
    t0 = now;

    // while dragging, yaw is set straight from the pointer instead of sprung
    if (!dragging) step(yaw, 44, 11.5, dt);
    step(tiltX, 160, 18,   dt);
    step(tiltY, 160, 18,   dt);
    lift.target = (hovering || dragging) ? 1 : 0;
    step(lift,  200, 22,   dt);

    showShape(shapeAt(yaw.value));

    // gentle idle drift so the mark reads as solid before you touch it
    idle += dt;
    const drift = (hovering || dragging || reduce.matches) ? 0 : 1;
    const ry = yaw.value + tiltY.value + drift * 7   * Math.sin(idle * 0.55);
    const rx = tiltX.value            + drift * 3.5 * Math.sin(idle * 0.41 + 1.1);

    mark.style.transform =
      `translateZ(calc(var(--px) * ${(lift.value * 26).toFixed(2)}px)) ` +
      `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;

    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  const spin = () => {
    yaw.target += 360;
    yaw.vel += reduce.matches ? 60 : 150;   // a kick so the turn starts with snap
  };

  // --- drag to spin ---------------------------------------------------------
  // Pointer moves are tracked on the window, not the mark: the hit shape is
  // swapped mid-spin, so anything anchored to it would drop the gesture.
  let dragX = 0, dragYaw = 0, dragDist = 0, dragSens = 0.45, dragVel = 0, lastMove = 0;

  const startDrag = (e) => {
    dragging = true;
    dragX = e.clientX;
    dragYaw = yaw.value;
    dragDist = 0;
    dragVel = 0;
    lastMove = performance.now();
    // a drag across roughly half the footer is one full turn, at any size
    dragSens = 360 / Math.max(240, footer.clientWidth * 0.55);
    yaw.target = yaw.value;
    yaw.vel = 0;
    document.body.classList.add('dragging');
  };

  const moveDrag = (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragX;
    dragDist = Math.max(dragDist, Math.abs(dx));
    const prev = yaw.value;
    const now = performance.now();
    const dt = (now - lastMove) / 1000;
    yaw.value = yaw.target = dragYaw + dx * dragSens;
    if (dt > 0.001) dragVel = 0.7 * dragVel + 0.3 * ((yaw.value - prev) / dt);
    lastMove = now;
  };

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    // holding still before letting go should not fling it
    const v = (performance.now() - lastMove > 120) ? 0 : dragVel;
    yaw.vel = v;
    // carry the flick, then settle with a face toward the viewer. 0.15s is
    // about 1/omega for this spring, so it coasts to a stop without reversing.
    yaw.target = 360 * Math.round((yaw.value + v * 0.15) / 360);
  };

  addEventListener('pointermove', moveDrag);
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);

  hit.addEventListener('click', () => {
    if (dragDist > 5) { dragDist = 0; return; }   // that was a drag, not a click
    spin();
  });
  hit.addEventListener('mouseup', () => hit.blur());   // keyboard ring only
  hit.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); }
  });

  for (const path of hit.querySelectorAll('path')) {
    path.addEventListener('pointerdown', startDrag);
    path.addEventListener('pointerenter', () => { hovering = true; });
    path.addEventListener('pointerleave', () => {
      hovering = false;
      if (!dragging) tiltX.target = tiltY.target = 0;
    });
    path.addEventListener('pointermove', (e) => {
      if (dragging || reduce.matches) return;
      const r = footer.getBoundingClientRect();
      tiltY.target =  ((e.clientX - r.left) / r.width  - 0.2842) * 90;
      tiltX.target = -((e.clientY - r.top)  / r.height - 0.3249) * 90;
    });
  }

  // Keep the yaw number from growing without bound. Wrap by two turns so the
  // shape parity that shapeAt() derives from it is preserved.
  const CYCLE = 360 * 2;
  setInterval(() => {
    if (Math.abs(yaw.vel) < 1 && Math.abs(yaw.target - yaw.value) < 0.1 && yaw.target >= CYCLE) {
      const wrap = Math.floor(yaw.target / CYCLE) * CYCLE;
      yaw.target -= wrap; yaw.value -= wrap;
    }
  }, 1000);
})();
</script>
