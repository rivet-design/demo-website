/* ─────────────────────────────────────────────────────────
 * ANIMATION STORYBOARD — Rivet modular logo motion
 *
 * Structural rule: pieces A (left ribbon) and B (right ribbon)
 * are a single permanently-joined unit — the "chevron." They
 * share one pivot and always receive the identical transform,
 * so their overlap never shifts, stretches, or separates. Only
 * piece C (the small diamond) is an independent rigid body that
 * detaches, travels, and rotates on its own around the chevron.
 * Nothing is redrawn, morphed, or scaled — every stage is pure
 * translate + rotate of these two units.
 *
 * Read top-to-bottom. Each `at` value is ms after trigger.
 *
 *     0ms   STATE 1 — source configuration: chevron upright,
 *           diamond nested in the notch below it
 *   320ms   hold, then begin transition → STATE 2
 *  1220ms   STATE 2 — the entire original lockup (chevron + diamond,
 *           unchanged relative arrangement) spins rigidly +150°
 *           (clockwise) about the whole composition's own center,
 *           so it reads as centered in place, not floating/orbiting.
 *           Once settled it rocks gently side to side in place —
 *           a pen tip planted on paper, not an idle float.
 *  1540ms   hold, then begin transition → STATE 3
 *  2440ms   STATE 3 — chevron unit rotates 180° about its own
 *           pivot (becomes a downward V/heart); diamond settles
 *           centered just below its tip. The whole mark then gives one
 *           soft physical bounce in place (both pieces moving as a
 *           single unit); once that settles, the chevron itself starts
 *           pulsing like a real heartbeat — lub, quick quiet dub, then
 *           a long relaxed pause before repeating — while the diamond
 *           stays put.
 *  2760ms   hold, then begin transition → STATE 4
 *  3660ms   STATE 4 — chevron unit returns upright, lower in frame, and
 *           stays completely still; diamond rises to center above it,
 *           then plays the IDLE gesture alone (see IDLE's own comment
 *           for the full timeline): a quiet breath, then it notices
 *           something and tilts, then eases back to dead center.
 *  3980ms   hold, then transition back → STATE 1 (seamless loop)
 * ───────────────────────────────────────────────────────── */

const TIMING = {
  trans: 900,      // ms for each state-to-state transition
  transState4To1: 600, // shorter transition specifically for the state 4 → state 1 hop — the position
                        // springs (~500-550ms to settle) still land cleanly, just with less scheduling
                        // buffer after, so the loop-back happens sooner without truncating the motion
  stateDwell: 2300, // target total time spent at EACH state (transition-in + hold) — kept equal across
                     // all four states so the loop has a consistent rhythm rather than some beats
                     // feeling rushed and others long. Per-state hold values below are derived from
                     // this so they always sum back to it.
  // states 3 and 4 each end their hold with a brief settle: state 3's
  // HEARTBEAT pulse eases to exactly zero, and state 4's IDLE gesture has
  // already resolved itself back to rest (see IDLE's own timeline) —
  // both sitting fully static for a short beat before the cut to the
  // next state, so the cut always lands on a still frame.
  squashSettleFadeMs: 200,
  squashSettleStaticMs: 80,
  // IDLE (state 4) resolves itself back to exactly 0 well before the cut
  // — it doesn't need a forced fade like HEARTBEAT does — so this is just
  // a small guaranteed-still buffer, kept short so the cut to state 1
  // follows shortly after the tilt settles rather than lingering.
  joySettleFadeMs: 0,
  joySettleStaticMs: 40,
};
// State 1 and state 4 deliberately break from the shared stateDwell —
// state 1 dwells a little less (it's just the resting start, doesn't
// need as long before handing off to state 2) and state 4 dwells a
// little more (extra room after its settle before looping back to 1).
TIMING.hold = 1100; // state 1's hold before transitioning to state 2
// IDLE's own timeline (see its comment above) finishes its last target
// change at headReturnStartMs=1930 and its spring is under 0.3° of
// residual tilt by ~2180ms — holdState4 is trimmed close to that so the
// cut to state 1 follows right behind, no lingering.
TIMING.holdState4 = 2350; // state 4's hold (the IDLE gesture, then its own settle) before transitioning to state 1
// State 3's hold covers BOUNCE_SETTLE_MS (the whole-mark bounce landing
// in place) plus two full HEARTBEAT cycles (~850ms each) once the pulse
// takes over, plus the guaranteed pre-cut fade/pause below — so neither
// the bounce nor the pulse ever gets cut short.
TIMING.holdState3 = 2900;

// State 2's own clock: the pen "writes" the ink over INK_REVEAL_MS, then
// holds briefly once fully drawn, before the loop moves on to state 3.
// INK_HOLD_MS is set so INK_REVEAL_MS + INK_HOLD_MS matches stateDwell too.
const INK_REVEAL_MS = 2000;
const INK_HOLD_MS = TIMING.stateDwell - INK_REVEAL_MS;

/* CHEVRON — pieces A + B, always moved as one rigid unit about a
 * shared pivot (the midpoint of their own bounding-box centers).
 * Because both pieces receive the exact same {tx, ty, rot} about
 * the exact same pivot every frame, their relative geometry —
 * and therefore their overlap — is mathematically frozen. */
const CHEVRON = {
  pivot: null, // computed at wiring time
  states: [
    { tx: 0,  ty: 0,  rot: 0 },     // 1 — source, upright
    { tx: 22.39, ty: 75.07, rot: 150 }, // 2 — whole lockup, rotated about the composition's own center
    { tx: 0,  ty: -30, rot: 180 },  // 3 — flips in place → downward V, shifted up to recenter with the diamond's gap
    { tx: 0,  ty: 88, rot: 0 },     // 4 — upright again, lower in frame; nudged down a bit further to widen the gap to the diamond
  ],
  spring: { stiffness: 170, damping: 15 }, // slight overshoot = magnetic snap
  springToState2: { stiffness: 300, damping: 20 }, // faster 1→2 travel, same overshoot character
  staggerMs: 60, // chevron settles just after the diamond starts leading
};

/* DIAMOND — piece C, the one independent rigid body. Position
 * deltas share CHEVRON's coordinate space (the source 318×318
 * box, before the 81px stage-centering offset); rotation is
 * degrees about the diamond's own bounding-box center. */
const DIAMOND = {
  center: null, // computed at wiring time
  states: [
    { tx: 0,      ty: 0,       rot: 0 },   // 1 — nested in the notch
    { tx: -45.48, ty: -165.90, rot: 150 }, // 2 — same rotation as the chevron, about the shared pivot, so the whole original lockup just spins rigidly in place
    { tx: 0,      ty: 30,      rot: 0 },   // 3 — centered below the V's tip, clear of it
    { tx: 0,      ty: -242,    rot: 135 }, // 4 — centered above the chevron, flipped vertically; nudged up further to widen the gap to the chevron
  ],
  spring: { stiffness: 190, damping: 16 }, // lighter piece, slightly livelier
  springToState2: { stiffness: 340, damping: 21 }, // faster 1→2 travel, same overshoot character
  staggerMs: -40, // diamond leads the group
};

/* WIGGLE — state 2 only. The whole lockup (chevron + diamond, unchanged
 * relative arrangement) rests at its already-tuned +150° position and
 * gently rocks side to side in place, like a pen tip planted on paper
 * with a hand trembling slightly — not a floating idle animation. Applied
 * identically to CHEVRON and DIAMOND's tx (and a touch of rot) at render
 * time only, so it never touches the springs' own settle behavior.
 * (No SVG mark/reveal for now — removed until the pen motion itself
 * reads right; re-add once this feels correct.) */
const WIGGLE = {
  ampPx: 7,       // side-to-side translation amplitude (slightly exaggerated)
  rotDeg: 2.8,    // slight accompanying tilt, like real contact weight
  hz: 1.7,        // a few rocks per second — visible, not buzzy
  rotPhase: 0.9,  // rotation lags translation slightly, less mechanical
};
const WIGGLE_SETTLE_MS = 160; // must finish well inside INK_HOLD_MS, so the cut to state 3 never lands mid-wiggle
function wiggleAt(now) {
  if (stage !== 1) return { dx: 0, drot: 0 };
  // The pen only moves while it's actually writing — once the trim-path
  // reveal finishes, settle out (not a hard cut) rather than keep wiggling.
  let amp = 1;
  if (inkStartTime !== null) {
    const sinceDone = now - inkStartTime - INK_REVEAL_MS;
    if (sinceDone > 0) amp = Math.max(0, 1 - sinceDone / WIGGLE_SETTLE_MS);
  }
  const t = now / 1000;
  return {
    dx: Math.sin(t * WIGGLE.hz * Math.PI * 2) * WIGGLE.ampPx * amp,
    drot: Math.sin(t * WIGGLE.hz * Math.PI * 2 + WIGGLE.rotPhase) * WIGGLE.rotDeg * amp,
  };
}

/* BOUNCE — state 3 only, whole mark. The instant chevron and diamond
 * land in the exclamation-mark pose, the WHOLE mark gives one soft,
 * physical bounce in place — real damped-spring physics (the same
 * mass-spring model as CHEVRON/DIAMOND's own pose springs), not a
 * scripted easing curve. It starts moving upward with an initial
 * velocity (a light toss), decelerates smoothly under the spring's
 * restoring pull, comes back through rest, slightly overshoots on the
 * other side (a much smaller rebound), and settles with one more subtle
 * ripple — continuous throughout, fastest through the middle of each
 * swing and slowest at the turning points. Applied through the exact
 * same offset to chevron and diamond alike, so the gap between them
 * never changes and they can only ever read as one rigid shape moving.
 * This settles out (see BOUNCE_SETTLE_MS) before HEARTBEAT below even
 * starts — the mark lands in place first, then begins pulsing, rather
 * than both happening at once. */
const BOUNCE = {
  stiffness: 120, // spring constant — how hard it pulls back toward rest
  damping: 9,     // resistance — tuned so the motion clearly decays over ~2 rebounds, not many
  v0: 900,        // px/s — initial upward toss speed (sets how high the first swing reaches)
};
const BOUNCE_SETTLE_MS = 900; // roughly how long BOUNCE takes to settle — HEARTBEAT waits this long before its first beat
let bounceSpring = null; // { y, vy } — null when not in state 3
function bounceStep(dt) {
  if (stage !== 2) { bounceSpring = null; return; }
  if (bounceSpring === null) bounceSpring = { y: 0, vy: -BOUNCE.v0 };
  const force = -BOUNCE.stiffness * bounceSpring.y - BOUNCE.damping * bounceSpring.vy;
  bounceSpring.vy += force * dt;
  bounceSpring.y += bounceSpring.vy * dt;
}
function bounceAt() {
  if (stage !== 2 || bounceSpring === null) return { dy: 0 };
  return { dy: bounceSpring.y };
}

/* HEARTBEAT — state 3 only, chevron only. Once the chevron has settled
 * into its downward-V "heart" silhouette, it pulses like an actual
 * heartbeat: a stronger beat (lub) immediately followed by a quieter,
 * quicker second beat (dub), then a much longer relaxed pause (diastole)
 * before the cycle repeats — never an even, metronomic pulse. Each beat
 * is a smooth raised-cosine bump (eases in and out, no snap), and it's a
 * plain uniform scale around the chevron's own pivot — no squash/stretch
 * asymmetry, since a heart swells fairly evenly, not vertically. Applied
 * only to the chevron (the "heart" shape); the diamond stays put.
 * Distinct in kind from WIGGLE's side-to-side rock (state 2) and IDLE's
 * breathe/tilt/lean gesture (state 4, both pieces). Layered on top of the chevron's
 * settled pose spring at render time only, so it never touches that
 * spring itself. */
const HEARTBEAT = {
  cycleMs: 850,   // one full lub-dub-rest cycle — ~70 bpm, a natural resting heart rate
  lubAt: 60,  lubKick: 4.1,  // the first, stronger beat — a velocity kick into the spring below
  dubAt: 215, dubKick: 2.22, // the second, quieter beat shortly after — a smaller kick
  // remaining time in the cycle (~570ms) is diastole — fully at rest —
  // before the next beat starts, same as a real heart spends most of
  // each cycle relaxed, not contracting.
  spring: { stiffness: 400, damping: 16 }, // quick and punchy, with just enough underdamping for
                                           // one natural overshoot/undershoot bounce per beat — not a repeating wobble
  bouncePxPerUnit: 45, // a small in-place vertical lift riding along with each beat, kept subtle
};
let heartbeatStartTime = null;
let heartbeatSpring = null; // { y, vy } — a real spring, kicked at each beat, not a scripted bump shape
let heartbeatCyclePos = -1; // last cycle-position seen, so each beat's kick fires exactly once per cycle
function heartbeatStep(now, dt) {
  // Waits out BOUNCE_SETTLE_MS before its first beat — the mark bounces
  // into place first, then starts pulsing, rather than both at once.
  if (stage !== 2 || now - stageStartTime < BOUNCE_SETTLE_MS) {
    heartbeatStartTime = null; heartbeatSpring = null; heartbeatCyclePos = -1;
    return;
  }
  if (heartbeatStartTime === null) {
    heartbeatStartTime = now;
    heartbeatSpring = { y: 0, vy: 0 };
    heartbeatCyclePos = -1;
  }
  const cyc = (now - heartbeatStartTime) % HEARTBEAT.cycleMs;
  if (heartbeatCyclePos < HEARTBEAT.lubAt && cyc >= HEARTBEAT.lubAt) heartbeatSpring.vy += HEARTBEAT.lubKick;
  if (heartbeatCyclePos < HEARTBEAT.dubAt && cyc >= HEARTBEAT.dubAt) heartbeatSpring.vy += HEARTBEAT.dubKick;
  heartbeatCyclePos = cyc;

  const s = HEARTBEAT.spring;
  const force = -s.stiffness * heartbeatSpring.y - s.damping * heartbeatSpring.vy;
  heartbeatSpring.vy += force * dt;
  heartbeatSpring.y += heartbeatSpring.vy * dt;
}
function heartbeatAt(now) {
  if (stage !== 2 || heartbeatSpring === null) return { scale: 1, dy: 0 };
  let y = heartbeatSpring.y;

  // Same forced settle as JOY (see there for why it's gated on `playing`) —
  // fades the pulse to nothing before the cut into state 4, so it never
  // gets chopped off mid-beat.
  if (playing) {
    const elapsedInStage = now - stageStartTime;
    const fadeStart = TIMING.holdState3 - TIMING.squashSettleFadeMs - TIMING.squashSettleStaticMs;
    if (elapsedInStage > fadeStart) {
      const p = Math.min(Math.max((elapsedInStage - fadeStart) / TIMING.squashSettleFadeMs, 0), 1);
      y *= 0.5 * (1 + Math.cos(Math.PI * p));
    }
  }

  // Same underlying beat drives a small in-place vertical bounce too —
  // it lifts a touch as it swells, echoing the earlier free-standing
  // bounce, but kept subtle and tied to the same rhythm as the pulse
  // rather than a separate motion competing with it.
  return { scale: 1 + y, dy: -y * HEARTBEAT.bouncePxPerUnit };
}

/* IDLE — state 4 only. A restrained "noticing you" gesture, not a loop of
 * motion: the chevron (torso/shoulders) stays completely still — it is
 * never touched by IDLE at all — while the diamond (head) alone runs
 * through one quiet human beat, then lands back on its exact resting
 * pose. Every phase below is a TARGET that changes at a fixed time; a
 * real damped spring (stepIdleScalar) chases each target, so every move
 * carries its own soft anticipation and settle rather than being a
 * scripted tween — same physical-spring philosophy as BOUNCE and
 * HEARTBEAT above, just applied to the head alone.
 *
 * Timeline (ms from state-4 entry):
 *     0 – ~400   the diamond eases up to its enlarged state-4 size
 *                (headBaseScale) as it settles in — not an instant pop
 *     0 –  450   hold, fully still (the settled state-4 pose)
 *   450 – 1000   inhale continues (diamond breathes, swelling + rising
 *                subtly on top of its already-enlarged base size) while
 *                the tilt below is already starting — deliberately
 *                overlapping, not sequential, so it reads as one quick
 *                fluid gesture rather than a series of separate beats
 *  1000 – ~1300  diamond tilts dramatically and quickly, as if noticing
 *                something (breathing finishes relaxing underneath it)
 *  1300 – 1780   hold at the "noticed" pose
 *  1780 – 1930   diamond eases partway back toward center — anticipation
 *  1930 – ~2180  diamond completes its return to dead center
 *
 * Both the tilt and breathe target schedules resolve to exactly 0 well
 * inside holdState4 (headBaseScale stays at 1, since it's state 4's own
 * resting size, not a transient gesture); every spring is tuned just
 * under critical damping — one small, soft settle ripple as it locks to
 * rest, never a repeating bounce. */
const IDLE = {
  stillMs: 450,
  breatheInEndMs: 1120,   // head's breathe target = 1 up to here (inhale, then a brief hold at peak)
  breatheOutEndMs: 1720,  // head's breathe target = 0 from here on (exhale)

  headBaseScale: 1.32,    // the diamond's enlarged resting size for state 4 specifically — eases in via
                           // baseScaleSpring below rather than popping in, then holds for the whole state
  headBreatheScaleY: 0.008, headBreatheScaleX: 0.004, headBreatheDy: -1.4, // on top of headBaseScale

  tiltStartMs: 1000, tiltDeg: 24,          // diamond's curious tilt — big and unmistakable; starts while
                                             // the breath is still finishing (was 1550, 1750, 1970 before
                                             // that) — the two overlap on independent DOF (scale/dy vs
                                             // rotation) so it reads as one fluid gesture, not sequential beats
  correctStartMs: 1780, correctDeg: 7,     // anticipatory pull-back toward center, scaled with the tilt
  headReturnStartMs: 1930,                 // completes its return to dead center

  headSpring: { stiffness: 210, damping: 24 }, // ζ≈0.83 — quicker rise than before (was 150/21), still soft,
                                                 // one small settle ripple, never a repeat bounce
  headBreatheSpring: { stiffness: 85, damping: 13 },
  baseScaleSpring: { stiffness: 130, damping: 18 }, // eases into the enlarged size as state 4 begins
};
let idleState = null; // { headBreathe, headBreatheV, tilt, tiltV, scaleUp, scaleUpV }
function stepIdleScalar(state, key, target, cfg, dt) {
  const vk = key + "V";
  const force = -cfg.stiffness * (state[key] - target) - cfg.damping * state[vk];
  state[vk] += force * dt;
  state[key] += state[vk] * dt;
}
function idleStep(now, dt) {
  if (stage !== 3) { idleState = null; return; }
  if (idleState === null) {
    idleState = { headBreathe: 0, headBreatheV: 0, tilt: 0, tiltV: 0, scaleUp: 0, scaleUpV: 0 };
  }
  const t = now - stageStartTime;

  const headBreatheTarget = t < IDLE.stillMs ? 0 : (t < IDLE.breatheInEndMs ? 1 : 0);

  let tiltTarget;
  if (t < IDLE.tiltStartMs) tiltTarget = 0;
  else if (t < IDLE.correctStartMs) tiltTarget = IDLE.tiltDeg;
  else if (t < IDLE.headReturnStartMs) tiltTarget = IDLE.correctDeg;
  else tiltTarget = 0;

  stepIdleScalar(idleState, "headBreathe", headBreatheTarget, IDLE.headBreatheSpring, dt);
  stepIdleScalar(idleState, "tilt", tiltTarget, IDLE.headSpring, dt);
  stepIdleScalar(idleState, "scaleUp", 1, IDLE.baseScaleSpring, dt); // target is always 1 for the whole state
}
function idleAt() {
  if (idleState === null) {
    return { headScaleX: 1, headScaleY: 1, headDy: 0, headRot: 0 };
  }
  const base = 1 + idleState.scaleUp * (IDLE.headBaseScale - 1);
  return {
    headScaleX: base + idleState.headBreathe * IDLE.headBreatheScaleX,
    headScaleY: base + idleState.headBreathe * IDLE.headBreatheScaleY,
    headDy: idleState.headBreathe * IDLE.headBreatheDy,
    headRot: idleState.tilt,
  };
}

/* ---- spring integration ---------------------------------- */
// Simple damped-harmonic spring per DOF (Framer/react-spring style:
// force = -k·(x - target) - c·v). Semi-implicit Euler, run per frame.
function makeSpring() {
  return { tx: 0, ty: 0, rot: 0, vtx: 0, vty: 0, vrot: 0 };
}
function stepSpring(cur, target, cfg, dt) {
  ["tx", "ty", "rot"].forEach((k) => {
    const vk = "v" + k;
    const force = -cfg.stiffness * (cur[k] - target[k]) - cfg.damping * cur[vk];
    cur[vk] += force * dt;
    cur[k] += cur[vk] * dt;
  });
}

/* ---- wiring ------------------------------------------------ */
const pieceEls = {
  a: document.getElementById("piece-a"),
  b: document.getElementById("piece-b"),
  c: document.getElementById("piece-c"),
};
function bboxCenterOf(el) {
  const bbox = el.querySelector("path").getBBox();
  return { x: bbox.x + bbox.width / 2, y: bbox.y + bbox.height / 2 };
}
const centerA = bboxCenterOf(pieceEls.a);
const centerB = bboxCenterOf(pieceEls.b);
CHEVRON.pivot = { x: (centerA.x + centerB.x) / 2, y: (centerA.y + centerB.y) / 2 };
CHEVRON.spring2 = makeSpring();
CHEVRON.stageStartAt = 0;

DIAMOND.center = bboxCenterOf(pieceEls.c);
DIAMOND.spring2 = makeSpring();
DIAMOND.stageStartAt = 0;

const UNITS = [CHEVRON, DIAMOND];

/* ---- ink contact point (state 2 only) ---------------------- */
const inkBlobEl = document.getElementById("ink-blob");
function transformPoint(pt, pivot, tx, ty, rotDeg) {
  const rad = (rotDeg * Math.PI) / 180;
  const dx = pt.x - pivot.x, dy = pt.y - pivot.y;
  return {
    x: pivot.x + tx + dx * Math.cos(rad) - dy * Math.sin(rad),
    y: pivot.y + ty + dx * Math.sin(rad) + dy * Math.cos(rad),
  };
}
function bboxCorners(el) {
  const b = el.querySelector("path").getBBox();
  return [
    { x: b.x, y: b.y }, { x: b.x + b.width, y: b.y },
    { x: b.x, y: b.y + b.height }, { x: b.x + b.width, y: b.y + b.height },
  ];
}
// The lowest point of the chevron (pieces A+B) in its state-2 rest pose —
// the ink sits just below it, slightly right, like the reference.
const chevronCorners = [...bboxCorners(pieceEls.a), ...bboxCorners(pieceEls.b)];
const inkRaw = chevronCorners
  .map((pt) => transformPoint(pt, CHEVRON.pivot, CHEVRON.states[1].tx, CHEVRON.states[1].ty, CHEVRON.states[1].rot))
  .reduce((lowest, pt) => (pt.y > lowest.y ? pt : lowest));
const INK_ANCHOR = { x: inkRaw.x + 145, y: inkRaw.y - 30 };
let inkStartTime = null;
let inkPlaced = false; // the ink's own transform is set ONCE, never touched again — it does not wiggle

// The doodle's own thin tail-tip, in its native 142×39 coordinates — the
// point that gets pinned to INK_ANCHOR, so the scrawl reads as originating
// from the chevron's contact point rather than floating independently.
const INK_TIP_LOCAL = { x: 141.8, y: 22 };
const INK_SCALE = 0.9;

// Spine for the trim-path reveal, in the doodle's native coordinates,
// traced tip → outer loop → inner coil (the order the pen "wrote" it).
// Not a pixel-exact centerline of the hand-drawn artwork — just enough
// for the mask stroke (below) to uncover it in a believable order.
const INK_SPINE_POINTS = [
  { x: 133, y: 18 }, { x: 110, y: 6 }, { x: 88, y: 2 }, { x: 52, y: 1 },
  { x: 15, y: 8 }, { x: 2, y: 22 }, { x: 15, y: 33 }, { x: 39, y: 37 },
  { x: 65, y: 33 }, { x: 82, y: 27 }, { x: 78, y: 15 }, { x: 55, y: 8 },
  { x: 36, y: 16 }, { x: 55, y: 16 },
];
function buildInkSpineD(points) {
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(i - 1, 0)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(i + 2, points.length - 1)];
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    d += ` C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;
  }
  return d;
}
const inkRevealStroke = document.getElementById("ink-reveal-stroke");
inkRevealStroke.setAttribute("d", buildInkSpineD(INK_SPINE_POINTS));
const inkStrokeLen = inkRevealStroke.getTotalLength();
inkRevealStroke.setAttribute("stroke-dasharray", `${inkStrokeLen} ${inkStrokeLen}`);
inkRevealStroke.setAttribute("stroke-dashoffset", String(inkStrokeLen));

let stage = 0;
let stageStartTime = 0; // ms, wall clock at which `stage` last changed (before stagger)

function applyChevron(w, bounce, hb) {
  const p = CHEVRON.pivot;
  const s = CHEVRON.spring2;
  // BOUNCE's whole-mark toss and HEARTBEAT's own small per-beat lift both
  // add into the same vertical offset; HEARTBEAT's pulse scales around
  // the chevron's own pivot. IDLE (state 4) never touches the chevron at
  // all — the body stays completely still; only the diamond moves.
  const m = `translate(${p.x + s.tx + w.dx} ${p.y + s.ty + bounce.dy + hb.dy}) rotate(${s.rot + w.drot}) scale(${hb.scale}) translate(${-p.x} ${-p.y})`;
  pieceEls.a.setAttribute("transform", m);
  pieceEls.b.setAttribute("transform", m);
}
function applyDiamond(w, bounce, idle) {
  const c = DIAMOND.center;
  const s = DIAMOND.spring2;
  const inner = `translate(${c.x + s.tx + w.dx} ${c.y + s.ty + bounce.dy + idle.headDy}) rotate(${s.rot + w.drot + idle.headRot}) scale(${idle.headScaleX} ${idle.headScaleY}) translate(${-c.x} ${-c.y})`;
  pieceEls.c.setAttribute("transform", inner);
}

function applyInk(now) {
  if (stage !== 1) {
    inkStartTime = null;
    inkPlaced = false;
    inkBlobEl.setAttribute("opacity", "0");
    inkRevealStroke.setAttribute("stroke-dashoffset", String(inkStrokeLen));
    return;
  }
  if (inkStartTime === null) inkStartTime = now;
  if (!inkPlaced) {
    // Set once, at the doodle's own original angle (no rotation) — the ink
    // is inert once it exists. Only the trim-path reveal below is animated.
    inkBlobEl.setAttribute("opacity", "0.92");
    inkBlobEl.setAttribute(
      "transform",
      `translate(${INK_ANCHOR.x} ${INK_ANCHOR.y}) scale(${INK_SCALE}) translate(${-INK_TIP_LOCAL.x} ${-INK_TIP_LOCAL.y})`
    );
    inkPlaced = true;
  }
  const t = Math.min((now - inkStartTime) / INK_REVEAL_MS, 1); // the pen "writing" — the ink's only motion
  const eased = 1 - Math.pow(1 - t, 3);
  inkRevealStroke.setAttribute("stroke-dashoffset", String(inkStrokeLen * (1 - eased)));
}

function setStage(n) {
  stage = ((n % 4) + 4) % 4;
  stageStartTime = performance.now();
  UNITS.forEach((u) => { u.stageStartAt = stageStartTime + u.staggerMs; });
  updateButtons();
}

function updateButtons() {
  document.querySelectorAll("#controls button[data-stage]").forEach((b) => {
    b.classList.toggle("active", Number(b.dataset.stage) === stage);
  });
}

let lastFrame = performance.now();
function tick(now) {
  const dt = Math.min((now - lastFrame) / 1000, 1 / 30);
  lastFrame = now;
  if (now >= CHEVRON.stageStartAt) {
    // state 1 → 2 travels faster (same overshoot character, just quicker)
    const cs = stage === 1 ? CHEVRON.springToState2 : CHEVRON.spring;
    stepSpring(CHEVRON.spring2, CHEVRON.states[stage], cs, dt);
  }
  if (now >= DIAMOND.stageStartAt) {
    const ds = stage === 1 ? DIAMOND.springToState2 : DIAMOND.spring;
    stepSpring(DIAMOND.spring2, DIAMOND.states[stage], ds, dt);
  }
  bounceStep(dt);
  heartbeatStep(now, dt);
  idleStep(now, dt);

  const w = wiggleAt(now);
  const bounce = bounceAt();
  const hb = heartbeatAt(now);
  const idle = idleAt();
  applyChevron(w, bounce, hb);
  applyDiamond(w, bounce, idle);
  applyInk(now);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- playback: advances `stage` on TIMING, loops by default ---- */
let playTimers = [];
let playing = false;
let looping = true;

function clearPlayTimers() {
  playTimers.forEach(clearTimeout);
  playTimers = [];
}

function scheduleLoop() {
  clearPlayTimers();
  let t = TIMING.hold;
  // total time to stay on each nextStage below before advancing — all four
  // sum to TIMING.stateDwell, so every state gets the same amount of
  // screen time. State 2 (i=0) spends it on the ink's own clock (write,
  // then a short hold) rather than the generic transition+hold used by
  // states 1 and 3; state 4 (i=2) spends its share on the full-amplitude
  // waddle (holdState4) plus its own ease-to-static settle, mirroring
  // state 3's squash settle just before it.
  const dwell = [
    INK_REVEAL_MS + INK_HOLD_MS,
    TIMING.trans + TIMING.holdState3,
    TIMING.trans + TIMING.holdState4 + TIMING.joySettleFadeMs + TIMING.joySettleStaticMs,
    TIMING.transState4To1 + TIMING.hold, // shorter transition specifically for this hop (see TIMING.transState4To1)
  ];
  [1, 2, 3, 0].forEach((nextStage, i) => {
    playTimers.push(setTimeout(() => setStage(nextStage), t));
    t += dwell[i];
  });
  if (looping) {
    playTimers.push(setTimeout(scheduleLoop, t - TIMING.hold));
  } else {
    playTimers.push(setTimeout(() => { playing = false; playBtn.textContent = "▶ play"; }, t - TIMING.hold));
  }
}

const playBtn = document.getElementById("playBtn");
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ pause" : "▶ play";
  if (playing) {
    setStage(0);
    scheduleLoop();
  } else {
    clearPlayTimers();
  }
});

document.getElementById("loopChk").addEventListener("change", (e) => {
  looping = e.target.checked;
});

document.querySelectorAll("#controls button[data-stage]").forEach((b) => {
  b.addEventListener("click", () => {
    playing = false;
    playBtn.textContent = "▶ play";
    clearPlayTimers();
    setStage(Number(b.dataset.stage));
  });
});

setStage(0);
</script>

<script>
  // Embedded: cycle 3 -> 2 -> 3 forever, using the page's own setStage so all
  // of its per-state behaviour (the heartbeat in 3, the ink stroke in 2) runs
  // exactly as it does standalone. No re-implementation, no approximation.
  (function () {
    var HOLD_MS = 3200;
    var order = [2, 1];   // setStage is 0-indexed: 2 = state 3, 1 = state 2
    var i = 0;
    setStage(order[0]);
    setInterval(function () {
      i = (i + 1) % order.length;
      setStage(order[i]);
    }, HOLD_MS);
  })();
</script>
