<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit Builder 1.0 — System Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --titlebar-h:20px;
    --menubar-h:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Chicago','Charcoal','Geneva','Helvetica Neue',Arial,sans-serif;
    color:#000;
    background:#fff;
    -webkit-font-smoothing:none;
    font-smooth:never;
    image-rendering:pixelated;
    overflow:hidden;
    height:100%;
  }

  /* ===== DESKTOP (50% gray dither) ===== */
  .desktop{
    position:fixed; inset:0;
    background-color:#fff;
    background-image:
      conic-gradient(#d6d6d6 25%, #ffffff 0 50%, #d6d6d6 0 75%, #ffffff 0);
    background-size:60px 60px;
    padding-top:var(--menubar-h);
    overflow:auto;
  }
  /* ===== MENU BAR ===== */
  .menubar{
    position:fixed; top:0; left:0; right:0; height:var(--menubar-h);
    background:#fff; border-bottom:2px solid #000;
    display:flex; align-items:center; padding:0 4px;
    z-index:1000; font-size:15px; user-select:none;
  }
  .menu{ position:relative; }
  .menu > .mlabel{
    padding:1px 11px; line-height:var(--menubar-h); height:var(--menubar-h);
    display:inline-flex; align-items:center; cursor:default;
  }
  .menu .apple{ font-size:16px; padding:0 12px; }
  .menubar .clock{ margin-left:auto; padding:0 12px; font-size:14px; letter-spacing:.5px; }

  /* ===== WINDOWS ===== */
  .win{ position:absolute; background:#fff; border:2px solid #000; box-shadow:1px 1px 0 #000; }
  .titlebar{
    height:var(--titlebar-h); border-bottom:2px solid #000;
    display:flex; align-items:center; position:relative;
    background:repeating-linear-gradient(#000 0 1px,#fff 1px 2px);
    cursor:default; touch-action:none;
  }
  .closebox{ width:12px; height:12px; margin-left:8px; border:2px solid #000; background:#fff; flex:0 0 auto; }
  .title{
    position:absolute; left:50%; transform:translateX(-50%); background:#fff;
    padding:0 10px; font-size:15px; font-weight:bold; white-space:nowrap;
    max-width:74%; overflow:hidden; text-overflow:ellipsis;
  }
  .win-body{ padding:12px; position:relative; }

  /* ===== PREVIEW WINDOW ===== */
  #win-preview{ left:22px; top:50px; width:312px; }
  .preview-stage{ border:2px solid #000; background:#fff; padding:10px; }
  svg.shirt{ width:100%; height:auto; display:block; image-rendering:pixelated; }
  .meta-row{
    display:flex; justify-content:space-between; margin-top:10px; font-size:14px;
    border:2px solid #000; padding:5px 8px; background:#fff;
  }
  .meta-row .lbl{ font-weight:bold; }
  .meta-row .val{ font-family:'Monaco','Geneva',monospace; }

  .fill-section h4{ margin:12px 0 7px; font-size:13px; font-weight:bold; }

  /* MacPaint-style pattern palette */
  .pat-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:0; border:2px solid #000; width:max-content; }
  .pat-cell{
    width:26px; height:26px; border-right:1px solid #000; border-bottom:1px solid #000;
    cursor:pointer; position:relative; background-color:#fff;
  }
  .pat-grid .pat-cell:nth-child(8n){ border-right:none; }
  .pat-grid .pat-cell:nth-last-child(-n+8){ border-bottom:none; }
  .pat-cell.sel{ box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 4px #000; }
  .pat-cell.sel::after{ content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px #000; }
  .pat-name{ font-family:'Monaco','Geneva',monospace; font-size:12px; margin-top:6px; min-height:14px; }

  @media (max-width:900px){
    .win{ position:relative !important; left:auto !important; top:auto !important; width:auto !important; margin:14px; }
    .desktop{ display:block; }
  }
</style>
</head>
<body>

<!-- ===== MENU BAR ===== -->
<div class="menubar" id="menubar">
  <div class="menu"><span class="mlabel apple"></span></div>
  <div class="menu"><span class="mlabel">File</span></div>
  <div class="menu"><span class="mlabel">Edit</span></div>
  <div class="menu"><span class="mlabel">View</span></div>
  <div class="menu"><span class="mlabel">Special</span></div>
  <span class="clock" id="clock">--:--</span>
</div>

<!-- ===== DESKTOP ===== -->
<div class="desktop" id="desktop">

  <!-- ===== PREVIEW WINDOW ===== -->
  <section class="win" id="win-preview">
    <div class="titlebar" data-drag="win-preview">
      <span class="closebox"></span>
      <span class="title">Kit Builder 1.0</span>
    </div>
    <div class="win-body">
      <div class="preview-stage">
        <svg class="shirt" viewBox="0 0 240 270" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-label="Football shirt preview">
          <defs>
            <pattern id="pat-white" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/></pattern>
            <pattern id="pat-black" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#000"/></pattern>
            <pattern id="pat-gray50" width="2" height="2" patternUnits="userSpaceOnUse">
              <rect width="2" height="2" fill="#fff"/><rect x="0" y="0" width="1" height="1" fill="#000"/><rect x="1" y="1" width="1" height="1" fill="#000"/>
            </pattern>
            <pattern id="pat-gray25" width="4" height="4" patternUnits="userSpaceOnUse">
              <rect width="4" height="4" fill="#fff"/><rect x="0" y="0" width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/>
            </pattern>
            <pattern id="pat-diag" width="4" height="4" patternUnits="userSpaceOnUse">
              <rect width="4" height="4" fill="#fff"/><rect x="3" y="0" width="1" height="1" fill="#000"/><rect x="2" y="1" width="1" height="1" fill="#000"/><rect x="1" y="2" width="1" height="1" fill="#000"/><rect x="0" y="3" width="1" height="1" fill="#000"/>
            </pattern>
            <pattern id="pat-horiz" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect x="0" y="0" width="4" height="1" fill="#000"/></pattern>
            <pattern id="pat-vert" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect x="0" y="0" width="1" height="4" fill="#000"/></pattern>
            <pattern id="pat-cross" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect x="0" y="0" width="4" height="1" fill="#000"/><rect x="0" y="0" width="1" height="4" fill="#000"/></pattern>
            <clipPath id="bodyClip">
              <rect x="56" y="40" width="128" height="16"/><rect x="48" y="56" width="144" height="160"/><rect x="56" y="216" width="128" height="16"/>
            </clipPath>
          </defs>

          <g id="sleeveL">
            <rect x="8"  y="40" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="16" y="56" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="24" y="72" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="8"  y="86" width="48" height="10" fill="var(--trim-fill)" stroke="#000" stroke-width="1"/>
          </g>
          <g id="sleeveR">
            <rect x="192" y="40" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="184" y="56" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="176" y="72" width="40" height="16" fill="var(--accent-fill)" stroke="#000" stroke-width="1"/>
            <rect x="184" y="86" width="48" height="10" fill="var(--trim-fill)" stroke="#000" stroke-width="1"/>
          </g>

          <g id="bodyGroup" clip-path="url(#bodyClip)"><rect x="48" y="40" width="144" height="192" fill="var(--body-fill)"/></g>

          <g fill="none" stroke="#000" stroke-width="2">
            <rect x="56" y="40" width="128" height="16"/><rect x="48" y="56" width="144" height="160"/><rect x="56" y="216" width="128" height="16"/>
          </g>
          <rect x="56" y="226" width="128" height="6" fill="var(--trim-fill)" stroke="#000" stroke-width="1"/>

          <g id="collar" stroke="#000" stroke-width="1">
            <rect x="96"  y="40" width="48" height="8" fill="var(--accent-fill)"/>
            <rect x="104" y="48" width="32" height="8" fill="var(--accent-fill)"/>
            <rect x="112" y="56" width="16" height="8" fill="var(--trim-fill)"/>
            <rect x="96"  y="40" width="48" height="4" fill="var(--trim-fill)"/>
          </g>

          <text id="nameText" x="120" y="106" text-anchor="middle"
                font-family="'Monaco','Geneva',monospace" font-weight="bold" font-size="20"
                fill="#000" stroke="#fff" stroke-width="4" paint-order="stroke" letter-spacing="1">ZICO</text>
          <text id="numText" x="120" y="200" text-anchor="middle"
                font-family="'Chicago','Monaco',monospace" font-weight="bold" font-size="108"
                fill="#000" stroke="#fff" stroke-width="7" paint-order="stroke">10</text>
        </svg>
      </div>

      <div class="meta-row">
        <span><span class="lbl">Name:</span> <span class="val">ZICO</span></span>
        <span><span class="lbl">No.</span> <span class="val">10</span></span>
      </div>

      <div class="fill-section">
        <h4>Body Fill</h4>
        <div class="pat-grid" id="bodyPats"></div>
        <div class="pat-name" id="bodyPatName"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var root=document.documentElement;

  /* ===== MacPaint pattern set ===== */
  var PATS=[
    {id:'white',name:'WHITE'},{id:'gray25',name:'25% GRAY'},{id:'gray50',name:'50% GRAY'},{id:'black',name:'BLACK'},
    {id:'horiz',name:'LINES H'},{id:'vert',name:'LINES V'},{id:'diag',name:'DIAGONAL'},{id:'cross',name:'WEAVE'}
  ];
  function patCSS(id){
    switch(id){
      case 'white': return 'background:#fff';
      case 'black': return 'background:#000';
      case 'gray50':return 'background-color:#fff;background-image:linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);background-size:4px 4px;background-position:0 0,2px 2px';
      case 'gray25':return 'background-color:#fff;background-image:radial-gradient(#000 38%,transparent 40%);background-size:4px 4px';
      case 'diag':  return 'background:repeating-linear-gradient(135deg,#000 0 1px,#fff 1px 4px)';
      case 'horiz': return 'background:repeating-linear-gradient(0deg,#000 0 1px,#fff 1px 4px)';
      case 'vert':  return 'background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 4px)';
      case 'cross': return 'background-color:#fff;background-image:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 4px)';
      default:      return 'background:#fff';
    }
  }
  function patName(id){ for(var i=0;i<PATS.length;i++){ if(PATS[i].id===id) return PATS[i].name; } return id; }

  /* ===== state ===== */
  var state={ body:'gray50' };

  function render(){
    root.style.setProperty('--body-fill','url(#pat-'+state.body+')');
    root.style.setProperty('--accent-fill','url(#pat-black)');
    root.style.setProperty('--trim-fill','url(#pat-white)');
    document.getElementById('bodyPatName').textContent='= '+patName(state.body);
  }

  /* ===== body-fill palette ===== */
  var palette=document.getElementById('bodyPats');
  PATS.forEach(function(p){
    var cell=document.createElement('div');
    cell.className='pat-cell'+(state.body===p.id?' sel':'');
    cell.setAttribute('style',patCSS(p.id)); cell.title=p.name;
    cell.addEventListener('click',function(){
      state.body=p.id; render();
      Array.prototype.forEach.call(palette.querySelectorAll('.pat-cell'),function(c,i){
        c.classList.toggle('sel',PATS[i].id===state.body);
      });
    });
    palette.appendChild(cell);
  });

  /* ===== clock ===== */
  function pad(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date(), h=d.getHours(), ap=h<12?'AM':'PM'; h=h%12; if(h===0)h=12;
    document.getElementById('clock').textContent=h+':'+pad(d.getMinutes())+' '+ap;
  }
  tick(); setInterval(tick,1000);

  /* ===== draggable window ===== */
  var manuallyMoved=false;
  function centerWindows(){
    if(window.innerWidth<=900) return; /* mobile layout stacks in flow */
    var w=document.getElementById('win-preview');
    var mb=22;
    w.style.left=Math.round((window.innerWidth-w.offsetWidth)/2)+'px';
    w.style.top=Math.round(mb+(window.innerHeight-mb-w.offsetHeight)/2)+'px';
  }
  document.querySelectorAll('[data-drag]').forEach(function(barEl){
    var win=document.getElementById(barEl.getAttribute('data-drag'));
    var sx,sy,ox,oy,dragging=false;
    barEl.addEventListener('pointerdown',function(e){
      manuallyMoved=true; dragging=true;
      var r=win.getBoundingClientRect();
      win.style.left=r.left+'px'; win.style.top=r.top+'px';
      sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      barEl.setPointerCapture(e.pointerId);
    });
    barEl.addEventListener('pointermove',function(e){
      if(!dragging) return;
      win.style.left=(ox+e.clientX-sx)+'px';
      win.style.top=Math.max(24,(oy+e.clientY-sy))+'px';
    });
    barEl.addEventListener('pointerup',function(){ dragging=false; });
  });

  /* ===== init ===== */
  render();
  requestAnimationFrame(centerWindows);
  window.addEventListener('resize',function(){ if(!manuallyMoved) centerWindows(); });
})();
</script>
</body>
</html>
