name = "rivet-install-link"
main = "install-link.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "rivet.design/api/install-link", zone_name = "rivet.design" },
  { pattern = "www.rivet.design/api/install-link", zone_name = "rivet.design" }
]

[vars]
PUBLIC_SITE_URL = "https://rivet.design"
INSTALL_LINK_FROM = "Rivet <hello@rivet.design>"

# Set SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY with wrangler secret put.
# Configure a separate Worker + route for preview; never reuse production secrets.
